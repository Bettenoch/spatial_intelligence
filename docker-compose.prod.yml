#docker-compose.prod.yml
# ─────────────────────────────────────────────────────────────────────────────
# Production overrides — merge with base compose file on the VPS:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this adds:
#   - Nginx reverse proxy (handles SSL termination + static asset caching)
#   - Redis port NOT exposed publicly
#   - Stricter restart policy
#   - Resource limits so the VPS doesn't get starved
# ─────────────────────────────────────────────────────────────────────────────

services:

  api:
    restart: always
    environment:
      APP_ENV: production
      LOG_LEVEL: WARNING
    # Don't expose 8000 directly — Nginx proxies to it internally
    ports: !reset []
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1500M
        reservations:
          memory: 512M

  redis:
    restart: always
    # Remove the public port — Redis only reachable inside Docker network
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: nairobi_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Mount your SSL certs here (e.g. from Certbot / Let's Encrypt)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - nairobi_net
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M

volumes:
  nginx_logs:
    driver: local